<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181a" />
    <meta name="color-scheme" content="dark" />
    <style>body{margin:0;background:#18181a}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet" />
    <!-- WebMCP origin trial token goes here once the deploy domain is registered:
         <meta http-equiv="origin-trial" content="TOKEN" /> -->
    <title>GoToTheArchive</title>
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  </head>
  <body>
    <div id="root">
      <!-- First paint, before the bundle mounts: a branded splash instead of a
           black screen. React's createRoot().render() clears #root, so this is
           gone the moment the app is ready. -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#18181a;color:#b3aea4;font-family:Inter,system-ui,-apple-system,sans-serif">
        <div style="font-weight:600;font-size:15px;letter-spacing:-0.01em;color:#f2f0ec">GoToTheArchive</div>
        <div style="font-size:12.5px">Opening the archive…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
